# ise-mcp-server: docker compose for one ISE deployment (host port 8033). Shared hosts: docs/deploying.md.
#
#   cp .env.example .env && chmod 600 .env   # ISE_URL/USERNAME/PASSWORD and MCP_AUTH_TOKENS (one token per person)
#   docker compose up -d            # pulls ghcr.io/dr-stutters/ise-mcp-server (MCP_IMAGE_TAG, default latest)
#   docker compose up -d --build    # or build from this checkout (MCP_PULL_POLICY=build keeps the local image)
#
# Read-only unless .env sets MCP_ENABLE_WRITES=true (and MCP_ENABLE_DANGEROUS=true for CoA, ANC, deletes).
services:
  ise-mcp-server:
    image: ghcr.io/dr-stutters/ise-mcp-server:${MCP_IMAGE_TAG:-latest}
    pull_policy: ${MCP_PULL_POLICY:-always}
    build:
      context: .
    container_name: ise-mcp-server
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_CACHE_DIR: /cache
    ports:
      - "${MCP_PUBLISH_PORT:-8033}:8000"
    volumes:
      - spec-cache:/cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  spec-cache:
