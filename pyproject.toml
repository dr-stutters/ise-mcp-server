[project]
name = "ise-mcp-server"
version = "0.1.1"
description = "MCP server for Cisco Identity Services Engine (ISE): OpenAPI, ERS and MnT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dr-stutters", email = "drstuttersau@gmail.com" }]
requires-python = ">=3.12,<3.15"
dependencies = ["stutters-mcp-core", "defusedxml>=0.7.1"]

[project.scripts]
ise-mcp-server = "ise_mcp:main"

[tool.uv.sources]
stutters-mcp-core = { git = "https://github.com/dr-stutters/stutters-mcp-core", tag = "v0.1.1" }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ise_mcp"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "types-defusedxml>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
markers = ["live: needs the lab appliance (skipped when unreachable)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
files = ["src"]
