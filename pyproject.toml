[project]
name = "ise-mcp-server"
version = "0.25.0"
description = "MCP server for Cisco Identity Services Engine (ISE): OpenAPI, ERS and MnT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dr-stutters", email = "drstuttersau@gmail.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "defusedxml>=0.7.1",
    "cryptography>=43",
    "pyyaml>=6.0.2",   # ise_export_config / ise_diff_config (I42)
    # >>> bundled stutters-mcp-core v0.20.0 (scripts/bundle_core.py; do not edit)
    "fastmcp>=4.1,<5",
    "httpx>=0.28.1",
    "mcp>=2.0,<3",
    "pydantic-settings>=2.15.0",
    "tzdata>=2025.2",
    "uvicorn>=0.30",
    # <<< bundled stutters-mcp-core
]

[project.scripts]
ise-mcp-server = "ise_mcp:main"

# stutters-mcp-core is bundled into the package as ise_mcp._core (ADR-005 in stutters-mcp-core):
# python scripts/bundle_core.py vendor   (after a clone or a pin change; then uv lock if deps changed)
[tool.bundle-core]
tag = "v0.20.0"
commit = "674cad29275672bda1f2e17da4adc37c1314d84f"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ise_mcp"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "types-defusedxml>=0.7.0",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
markers = ["live: needs the lab appliance (skipped when unreachable)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ise_mcp._core", "ise_mcp._core.*"]   # bundled core: checked in stutters-mcp-core's own CI
ignore_errors = true
